name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  malware-scan:
    name: Malware Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Update malware definitions
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Scan repository
        run: |
          clamscan \
            --recursive \
            --infected \
            --exclude-dir='^./.git$' \
            .